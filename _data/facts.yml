# Single source of truth for every figure shown on this site.
# Rules (docs/SPEC.md section 4):
#  - Pages never type a price, quota, capacity or hardware count into prose. Use
#    {% include fact.html id="..." %} which renders the value with its source and date.
#  - Each entry: value (as displayed), source (title), url, as_of (when we checked the
#    source), owner (who sets it). Where another unit owns a figure, prefer linking to it.
#  - Changing anything here needs Chuck's review (CODEOWNERS).

